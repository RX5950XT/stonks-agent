name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
      UV_FROZEN: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8
        with:
          version: "0.9.27"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Install frozen environment
        run: uv sync --frozen

      - name: Run quality, security and governance gates
        run: uv run python scripts/verify.py

  postgres:
    name: PostgreSQL 17 integration / ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      UV_FROZEN: "1"
      STONKS_TEST_DATABASE_URL: postgresql+psycopg://postgres@127.0.0.1:5432/stonks_test
    services:
      postgres:
        image: postgres:17.10-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: stonks_test
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stonks_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8
        with:
          version: "0.9.27"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Install frozen environment
        run: uv sync --frozen

      - name: Run PostgreSQL integration and all core gates
        run: uv run python scripts/verify.py --with-postgres

  core-deployment:
    name: Hardened core Compose / ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      UV_FROZEN: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8
        with:
          version: "0.9.27"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install frozen core verification environment
        run: uv sync --frozen

      - name: Verify deployment policy and smoke runner
        run: |
          uv run python -m pytest -q --no-cov \
            tests/config/test_deployment.py \
            tests/entrypoints/test_deployment_health.py \
            tests/entrypoints/test_deployment_runtime.py \
            tests/entrypoints/test_deployment_replay_probe.py \
            tests/policy/test_core_deployment.py \
            tests/unit/test_smoke_core_deployment.py
          MYPYPATH="src:packages/contracts/src:packages/service-auth/src" \
            uv run mypy --strict \
            scripts/deployment_replay_probe.py \
            scripts/smoke_core_deployment.py

      - name: Build and exercise clean hardened deployment
        run: uv run python scripts/smoke_core_deployment.py

  s3-artifact:
    name: S3-compatible artifact runtime / ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      UV_FROZEN: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8
        with:
          version: "0.9.27"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install frozen environment
        run: uv sync --frozen

      - name: Pull exact S3-compatible runtime
        run: >-
          docker pull
          chrislusf/seaweedfs:4.34@sha256:6620371e8af8282056685c652d4637265698c9e2c2d59f9594e6ac333ad6c634

      - name: Run hardened real-runtime smoke
        run: >-
          uv run pytest tests/policy/test_s3_artifact_infra.py
          -q --no-cov

  openbb-sidecar:
    name: Optional OpenBB sidecar / ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      UV_FROZEN: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8
        with:
          version: "0.9.27"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Install frozen core verification environment
        run: uv sync --frozen

      - name: Verify static policy, sidecar lock and Compose model
        run: |
          uv run python scripts/verify_openbb_sidecar.py
          uv lock --check --project sidecars/openbb
          docker compose -f infra/compose.openbb.yaml config --quiet

      - name: Audit exact frozen sidecar dependencies
        shell: bash
        run: |
          uv export --project sidecars/openbb --quiet --frozen --no-dev \
            --no-emit-project --no-emit-local --format requirements.txt \
            --output-file "$RUNNER_TEMP/openbb-requirements.txt"
          uv run pip-audit --strict --requirement \
            "$RUNNER_TEMP/openbb-requirements.txt"

      - name: Build exact optional sidecar image
        run: docker compose -f infra/compose.openbb.yaml build --pull openbb

      - name: Prepare ephemeral OpenBB service identity
        run: >-
          uv run python scripts/prepare_openbb_smoke_auth.py
          --jwks-file "$RUNNER_TEMP/openbb-service-jwks.json"
          --github-env "$GITHUB_ENV"

      - name: Start healthy optional sidecar
        run: >-
          docker compose -f infra/compose.openbb.yaml up --detach --wait
          --wait-timeout 240 openbb

      - name: Smoke exact adapter and corresponding source
        run: >-
          uv run python scripts/smoke_openbb.py
          --health-timeout 120 --request-timeout 60

      - name: Verify health and deployed corresponding source
        shell: bash
        run: |
          curl --fail --silent --show-error \
            --retry 10 --retry-delay 2 --retry-all-errors \
            http://127.0.0.1:6900/healthz \
            | python -c 'import json,sys; p=json.load(sys.stdin); assert p == {"status":"ok","provider":"yfinance","source":"/source"}'
          curl --fail --silent --show-error \
            --dump-header /tmp/openbb-source.headers \
            --output /tmp/stonks-openbb-sidecar-source.tar.gz \
            http://127.0.0.1:6900/source
          grep --fixed-strings --ignore-case \
            'Link: </source>; rel="source"' /tmp/openbb-source.headers
          tar -tzf /tmp/stonks-openbb-sidecar-source.tar.gz \
            > /tmp/openbb-source-members.txt
          for member in \
            Dockerfile NOTICE.md OPENBB_LICENSE.txt SOURCE_OFFER.md \
            license-policy.yaml \
            provider-manifest.yaml pyproject.toml sbom.cdx.json uv.lock \
            packages/service-auth/LICENSE \
            packages/service-auth/pyproject.toml \
            packages/service-auth/src/stonks_service_auth/__init__.py \
            packages/service-auth/src/stonks_service_auth/authorization.py \
            packages/service-auth/src/stonks_service_auth/environment.py \
            packages/service-auth/src/stonks_service_auth/headers.py \
            packages/service-auth/src/stonks_service_auth/oidc.py \
            packages/service-auth/src/stonks_service_auth/py.typed \
            packages/service-auth/src/stonks_service_auth/source_identity.py \
            upstream/openbb_core-1.6.13.tar.gz \
            upstream/openbb_equity-1.6.2.tar.gz \
            upstream/openbb_platform_api-1.3.6.tar.gz \
            upstream/openbb_yfinance-1.6.3.tar.gz; do
            grep --fixed-strings --line-regexp "./${member}" \
              /tmp/openbb-source-members.txt
          done

      - name: Stop optional sidecar
        if: always()
        run: >-
          docker compose -f infra/compose.openbb.yaml down
          --volumes --remove-orphans

  nautilus-sidecar:
    name: Optional NautilusTrader sidecar / ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      UV_FROZEN: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8
        with:
          version: "0.9.27"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Install frozen core and sidecar environments
        run: |
          uv sync --frozen
          uv lock --check --project sidecars/nautilus
          uv sync --frozen --project sidecars/nautilus

      - name: Verify sidecar source and real engine replay
        shell: bash
        run: |
          uv run --project sidecars/nautilus ruff check sidecars/nautilus
          MYPYPATH=".:src:packages/contracts/src" \
            uv run --project sidecars/nautilus mypy --strict \
            sidecars/nautilus/adapter.py sidecars/nautilus/app.py \
            sidecars/nautilus/engine.py sidecars/nautilus/runtime_app.py
          PYTHONPATH=".:src:packages/contracts/src" \
            uv run --project sidecars/nautilus pytest -q --no-cov \
            sidecars/nautilus/tests

      - name: Audit exact frozen runtime dependencies
        shell: bash
        run: |
          uv export --project sidecars/nautilus --quiet --frozen --no-dev \
            --no-emit-project --no-emit-local --format requirements.txt \
            --output-file "$RUNNER_TEMP/nautilus-requirements.txt"
          uv run pip-audit --strict --requirement \
            "$RUNNER_TEMP/nautilus-requirements.txt"
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/nautilus-runtime" \
            uv sync --frozen --no-dev --project sidecars/nautilus
          uv run cyclonedx-py environment \
            "$RUNNER_TEMP/nautilus-runtime/bin/python" \
            --pyproject sidecars/nautilus/pyproject.toml \
            --output-reproducible --spec-version 1.6 --output-format JSON \
            --output-file "$RUNNER_TEMP/nautilus-sbom.cdx.json"
          uv run python scripts/verify_nautilus_sbom.py \
            "$RUNNER_TEMP/nautilus-sbom.cdx.json"

      - name: Build hardened sidecar image
        run: >-
          docker build -f sidecars/nautilus/Dockerfile
          -t stonks-nautilus-sidecar:p5.5 .

      - name: Resolve exact Nautilus runtime identity
        shell: bash
        run: |
          runtime_hash="$(uv run python -c "from pathlib import Path; from sidecars.nautilus.adapter import compute_runtime_hash; print(compute_runtime_hash(Path('sidecars/nautilus')))")"
          image_digest="$(docker image inspect stonks-nautilus-sidecar:p5.5 --format '{{.Id}}')"
          echo "NAUTILUS_RUNTIME_HASH=$runtime_hash" >> "$GITHUB_ENV"
          echo "NAUTILUS_IMAGE_DIGEST=$image_digest" >> "$GITHUB_ENV"

      - name: Prepare exact Nautilus service identity
        run: >-
          uv run python scripts/prepare_backtest_smoke_auth.py
          --jwks-file "$RUNNER_TEMP/nautilus-service-jwks.json"
          --github-env "$GITHUB_ENV" single --receiver nautilus
          --runtime-hash "$NAUTILUS_RUNTIME_HASH"
          --image-digest "$NAUTILUS_IMAGE_DIGEST"

      - name: Start sidecar with exact runtime identity
        shell: bash
        run: |
          docker network create --internal stonks-nautilus-ci
          docker run --detach --rm --name stonks-nautilus-ci \
            --network stonks-nautilus-ci \
            --read-only --tmpfs /tmp:size=64m,mode=1777 --cap-drop ALL \
            --security-opt no-new-privileges --memory 2g --memory-swap 2g \
            --cpus 2 --pids-limit 256 \
            --volume "$STONKS_SERVICE_OIDC_JWKS_HOST_FILE:/run/secrets/stonks-service-jwks.json:ro" \
            --env STONKS_NAUTILUS_RUNTIME_HASH="$NAUTILUS_RUNTIME_HASH" \
            --env STONKS_NAUTILUS_IMAGE_DIGEST="$NAUTILUS_IMAGE_DIGEST" \
            --env STONKS_SERVICE_OIDC_ISSUER \
            --env STONKS_SERVICE_OIDC_AUDIENCE="$STONKS_NAUTILUS_SERVICE_OIDC_AUDIENCE" \
            --env STONKS_SERVICE_OIDC_CORE_SUBJECT \
            --env STONKS_SERVICE_OIDC_CORE_CLIENT_ID \
            --env STONKS_SERVICE_OIDC_ALGORITHMS \
            --env STONKS_SERVICE_OIDC_RECEIVER=nautilus \
            --env STONKS_SERVICE_OIDC_JWKS_FILE=/run/secrets/stonks-service-jwks.json \
            "$NAUTILUS_IMAGE_DIGEST"
          for attempt in {1..30}; do
            docker exec stonks-nautilus-ci python -c \
              "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:7400/healthz', timeout=1).status == 200" \
              && break
            if [ "$attempt" -eq 30 ]; then exit 1; fi
            sleep 1
          done

      - name: Smoke canonical HTTP replay and image policy
        shell: bash
        run: |
          docker exec stonks-nautilus-ci python /workspace/scripts/smoke_nautilus.py \
            --runtime-hash "$NAUTILUS_RUNTIME_HASH" \
            --image-digest "$NAUTILUS_IMAGE_DIGEST" \
            --service-token "$NAUTILUS_SMOKE_TOKEN" \
            --requested-at "$NAUTILUS_SMOKE_REQUESTED_AT"
          test "$(docker image inspect stonks-nautilus-sidecar:p5.5 --format '{{.Config.User}}')" = "65532:65532"
          test "$(docker network inspect stonks-nautilus-ci --format '{{.Internal}}')" = "true"
          docker exec stonks-nautilus-ci python -c \
            "import importlib.util; assert importlib.util.find_spec('stonks_agent') is None"
          ! docker exec stonks-nautilus-ci env \
            | grep --extended-regexp --ignore-case \
              'database_url|postgres|redis_url|broker_token'
          docker exec stonks-nautilus-ci test -s \
            /usr/share/licenses/stonks-nautilus-sidecar/NAUTILUS-LGPL-3.0
          docker exec stonks-nautilus-ci test -s \
            /usr/share/licenses/stonks-nautilus-sidecar/GNU-GPL-3.0
          docker exec stonks-nautilus-ci sha256sum \
            /usr/share/source/nautilus-trader/nautilus_trader-1.230.0.tar.gz \
            | grep '^cc7eaa247e640e46588094fcca44f34f4b6330eeec41e9247068f2500921757d '

      - name: Stop NautilusTrader sidecar
        if: always()
        run: |
          docker rm --force stonks-nautilus-ci || true
          docker network rm stonks-nautilus-ci || true

  lean-sidecar:
    name: Optional QuantConnect LEAN sidecar / ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      UV_FROZEN: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8
        with:
          version: "0.9.27"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Install frozen core and sidecar environments
        run: |
          uv sync --frozen
          uv lock --check --project sidecars/lean
          uv sync --frozen --project sidecars/lean

      - name: Verify adapter, contracts, policy and fake replay
        shell: bash
        run: |
          uv run --project sidecars/lean ruff check \
            sidecars/lean scripts/smoke_lean.py scripts/verify_lean_sbom.py \
            tests/contracts/test_lean_sidecar.py \
            tests/security/test_lean_sidecar_boundary.py
          MYPYPATH=".:src:packages/contracts/src" \
            uv run --project sidecars/lean mypy --strict \
            sidecars/lean/adapter.py sidecars/lean/app.py \
            sidecars/lean/engine.py sidecars/lean/runtime_app.py \
            scripts/smoke_lean.py scripts/verify_lean_sbom.py
          PYTHONPATH=".:src:packages/contracts/src" \
            uv run --project sidecars/lean pytest -q --no-cov \
            sidecars/lean/tests tests/contracts/test_lean_sidecar.py \
            tests/security/test_lean_sidecar_boundary.py
          uv run pytest -q --no-cov tests/unit/test_verify_lean_sbom.py

      - name: Audit exact frozen Python dependencies
        shell: bash
        run: |
          uv export --project sidecars/lean --quiet --frozen --no-dev \
            --no-emit-project --no-emit-local --format requirements.txt \
            --output-file "$RUNNER_TEMP/lean-requirements.txt"
          uv run --project sidecars/lean pip-audit --strict --requirement \
            "$RUNNER_TEMP/lean-requirements.txt"

      - name: Build pinned source with locked NuGet vulnerability gate
        run: >-
          docker build -f sidecars/lean/Dockerfile
          -t stonks-lean-sidecar:p5.6 .

      - name: Generate and verify combined SBOM and image CVEs
        shell: bash
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$RUNNER_TEMP:/out" \
            anchore/syft@sha256:86fde6445b483d902fe011dd9f68c4987dd94e07da1e9edc004e3c2422650de6 \
            docker:stonks-lean-sidecar:p5.6 \
            -o cyclonedx-json=/out/lean-sbom.cdx.json
          uv run python scripts/verify_lean_sbom.py \
            "$RUNNER_TEMP/lean-sbom.cdx.json"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            anchore/grype@sha256:391bfda62888fb4e98ff5c4c81598f7431a3c1eac3f8519d69d1ff00df247c1d \
            docker:stonks-lean-sidecar:p5.6 --fail-on high --output table

      - name: Resolve exact LEAN runtime identity
        shell: bash
        run: |
          runtime_hash="$(PYTHONPATH=.:src:packages/contracts/src uv run --project sidecars/lean python -c 'from pathlib import Path; from sidecars.lean.adapter import compute_runtime_hash; print(compute_runtime_hash(Path("sidecars/lean")))')"
          image_digest="$(docker image inspect stonks-lean-sidecar:p5.6 --format '{{.Id}}')"
          echo "LEAN_RUNTIME_HASH=$runtime_hash" >> "$GITHUB_ENV"
          echo "LEAN_IMAGE_DIGEST=$image_digest" >> "$GITHUB_ENV"

      - name: Prepare exact LEAN service identity
        run: >-
          uv run python scripts/prepare_backtest_smoke_auth.py
          --jwks-file "$RUNNER_TEMP/lean-service-jwks.json"
          --github-env "$GITHUB_ENV" single --receiver lean
          --runtime-hash "$LEAN_RUNTIME_HASH"
          --image-digest "$LEAN_IMAGE_DIGEST"

      - name: Start hardened sidecar with exact runtime identity
        shell: bash
        run: |
          docker network create --internal stonks-lean-ci
          docker run --detach --name stonks-lean-ci \
            --network stonks-lean-ci --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=512m,uid=65532,gid=65532,mode=0700 \
            --cap-drop ALL --security-opt no-new-privileges \
            --memory 3g --memory-swap 3g --cpus 2 --pids-limit 256 \
            --volume "$STONKS_SERVICE_OIDC_JWKS_HOST_FILE:/run/secrets/stonks-service-jwks.json:ro" \
            --env STONKS_LEAN_RUNTIME_HASH="$LEAN_RUNTIME_HASH" \
            --env STONKS_LEAN_IMAGE_DIGEST="$LEAN_IMAGE_DIGEST" \
            --env STONKS_SERVICE_OIDC_ISSUER \
            --env STONKS_SERVICE_OIDC_AUDIENCE="$STONKS_LEAN_SERVICE_OIDC_AUDIENCE" \
            --env STONKS_SERVICE_OIDC_CORE_SUBJECT \
            --env STONKS_SERVICE_OIDC_CORE_CLIENT_ID \
            --env STONKS_SERVICE_OIDC_ALGORITHMS \
            --env STONKS_SERVICE_OIDC_RECEIVER=lean \
            --env STONKS_SERVICE_OIDC_JWKS_FILE=/run/secrets/stonks-service-jwks.json \
            "$LEAN_IMAGE_DIGEST"
          for attempt in {1..30}; do
            docker exec stonks-lean-ci python3 -c \
              "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:7410/healthz', timeout=1).status == 200" \
              && break
            if [ "$attempt" -eq 30 ]; then exit 1; fi
            sleep 1
          done

      - name: Smoke real LEAN replay, authority and license policy
        shell: bash
        run: |
          docker exec stonks-lean-ci python3 /workspace/scripts/smoke_lean.py \
            --runtime-hash "$LEAN_RUNTIME_HASH" \
            --image-digest "$LEAN_IMAGE_DIGEST" \
            --service-token "$LEAN_SMOKE_TOKEN" \
            --requested-at "$LEAN_SMOKE_REQUESTED_AT" --timeout 120
          test "$(docker image inspect stonks-lean-sidecar:p5.6 --format '{{.Config.User}}')" = "65532:65532"
          test "$(docker network inspect stonks-lean-ci --format '{{.Internal}}')" = "true"
          docker exec stonks-lean-ci python3 -c \
            "import importlib.util; assert importlib.util.find_spec('stonks_agent') is None"
          ! docker exec stonks-lean-ci env \
            | grep --extended-regexp --ignore-case \
              'database_url|postgres|redis_url|broker_token'
          docker exec stonks-lean-ci test -s \
            /usr/share/licenses/stonks-lean-sidecar/LEAN-APACHE-2.0
          docker exec stonks-lean-ci sha256sum \
            /usr/share/source/lean/lean-source.tar.gz \
            | grep '^258a6db94c942e77488e47cb8e5c873c2cc2cbc7e4bc1bce5d14ea4f31b6628f '
          docker exec stonks-lean-ci sha256sum \
            /usr/share/licenses/stonks-lean-sidecar/LEAN-APACHE-2.0 \
            | grep '^522cf0a716ce03f67d46f8fceb5bf78c5b84400ec5cd8d14bf9f02cddc1cb6ba '

      - name: Stop QuantConnect LEAN sidecar
        if: always()
        run: |
          docker rm --force stonks-lean-ci || true
          docker network rm stonks-lean-ci || true

  engine-parity:
    name: NautilusTrader / LEAN canonical parity / ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      UV_FROZEN: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8
        with:
          version: "0.9.27"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Install frozen core environment
        run: uv sync --frozen

      - name: Build both pinned sidecars
        run: |
          docker build -f sidecars/nautilus/Dockerfile \
            -t stonks-nautilus-sidecar:p5.5 .
          docker build -f sidecars/lean/Dockerfile \
            -t stonks-lean-sidecar:p5.6 .

      - name: Resolve exact parity runtime identities
        shell: bash
        run: |
          nautilus_hash="$(PYTHONPATH=.:src:packages/contracts/src uv run python -c 'from pathlib import Path; from sidecars.nautilus.adapter import compute_runtime_hash; print(compute_runtime_hash(Path("sidecars/nautilus")))')"
          lean_hash="$(PYTHONPATH=.:src:packages/contracts/src uv run python -c 'from pathlib import Path; from sidecars.lean.adapter import compute_runtime_hash; print(compute_runtime_hash(Path("sidecars/lean")))')"
          nautilus_image="$(docker image inspect stonks-nautilus-sidecar:p5.5 --format '{{.Id}}')"
          lean_image="$(docker image inspect stonks-lean-sidecar:p5.6 --format '{{.Id}}')"
          {
            echo "PARITY_NAUTILUS_HASH=$nautilus_hash"
            echo "PARITY_LEAN_HASH=$lean_hash"
            echo "PARITY_NAUTILUS_IMAGE=$nautilus_image"
            echo "PARITY_LEAN_IMAGE=$lean_image"
          } >> "$GITHUB_ENV"

      - name: Prepare exact parity service identities
        run: >-
          uv run python scripts/prepare_backtest_smoke_auth.py
          --jwks-file "$RUNNER_TEMP/parity-service-jwks.json"
          --github-env "$GITHUB_ENV" parity
          --nautilus-runtime-hash "$PARITY_NAUTILUS_HASH"
          --nautilus-image-digest "$PARITY_NAUTILUS_IMAGE"
          --lean-runtime-hash "$PARITY_LEAN_HASH"
          --lean-image-digest "$PARITY_LEAN_IMAGE"

      - name: Start isolated sidecars with exact identities
        shell: bash
        run: |
          docker network create --internal stonks-engine-parity-ci
          docker run --detach --name stonks-parity-nautilus-ci \
            --network stonks-engine-parity-ci --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=512m,uid=65532,gid=65532,mode=0700 \
            --cap-drop ALL --security-opt no-new-privileges \
            --memory 3g --memory-swap 3g --cpus 2 --pids-limit 256 \
            --volume "$STONKS_SERVICE_OIDC_JWKS_HOST_FILE:/run/secrets/stonks-service-jwks.json:ro" \
            --env STONKS_NAUTILUS_RUNTIME_HASH="$PARITY_NAUTILUS_HASH" \
            --env STONKS_NAUTILUS_IMAGE_DIGEST="$PARITY_NAUTILUS_IMAGE" \
            --env STONKS_SERVICE_OIDC_ISSUER \
            --env STONKS_SERVICE_OIDC_AUDIENCE="$STONKS_NAUTILUS_SERVICE_OIDC_AUDIENCE" \
            --env STONKS_SERVICE_OIDC_CORE_SUBJECT \
            --env STONKS_SERVICE_OIDC_CORE_CLIENT_ID \
            --env STONKS_SERVICE_OIDC_ALGORITHMS \
            --env STONKS_SERVICE_OIDC_RECEIVER=nautilus \
            --env STONKS_SERVICE_OIDC_JWKS_FILE=/run/secrets/stonks-service-jwks.json \
            "$PARITY_NAUTILUS_IMAGE"
          docker run --detach --name stonks-parity-lean-ci \
            --network stonks-engine-parity-ci --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=512m,uid=65532,gid=65532,mode=0700 \
            --cap-drop ALL --security-opt no-new-privileges \
            --memory 3g --memory-swap 3g --cpus 2 --pids-limit 256 \
            --volume "$STONKS_SERVICE_OIDC_JWKS_HOST_FILE:/run/secrets/stonks-service-jwks.json:ro" \
            --env STONKS_LEAN_RUNTIME_HASH="$PARITY_LEAN_HASH" \
            --env STONKS_LEAN_IMAGE_DIGEST="$PARITY_LEAN_IMAGE" \
            --env STONKS_SERVICE_OIDC_ISSUER \
            --env STONKS_SERVICE_OIDC_AUDIENCE="$STONKS_LEAN_SERVICE_OIDC_AUDIENCE" \
            --env STONKS_SERVICE_OIDC_CORE_SUBJECT \
            --env STONKS_SERVICE_OIDC_CORE_CLIENT_ID \
            --env STONKS_SERVICE_OIDC_ALGORITHMS \
            --env STONKS_SERVICE_OIDC_RECEIVER=lean \
            --env STONKS_SERVICE_OIDC_JWKS_FILE=/run/secrets/stonks-service-jwks.json \
            "$PARITY_LEAN_IMAGE"
          for attempt in {1..30}; do
            docker exec stonks-parity-nautilus-ci python -c \
              "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:7400/healthz', timeout=1).status == 200" \
              && break
            if [ "$attempt" -eq 30 ]; then exit 1; fi
            sleep 1
          done
          for attempt in {1..30}; do
            docker exec stonks-parity-lean-ci python3 -c \
              "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:7410/healthz', timeout=1).status == 200" \
              && break
            if [ "$attempt" -eq 30 ]; then exit 1; fi
            sleep 1
          done

      - name: Replay exact cross-engine fixture matrix
        shell: bash
        run: |
          docker exec --interactive stonks-parity-nautilus-ci python - \
            --nautilus-url http://stonks-parity-nautilus-ci:7400 \
            --nautilus-runtime-hash "$PARITY_NAUTILUS_HASH" \
            --nautilus-image-digest "$PARITY_NAUTILUS_IMAGE" \
            --nautilus-tokens-json "$PARITY_NAUTILUS_TOKENS_JSON" \
            --lean-url http://stonks-parity-lean-ci:7410 \
            --lean-runtime-hash "$PARITY_LEAN_HASH" \
            --lean-image-digest "$PARITY_LEAN_IMAGE" \
            --lean-tokens-json "$PARITY_LEAN_TOKENS_JSON" \
            --requested-at "$PARITY_SMOKE_REQUESTED_AT" --timeout 180 \
            < scripts/smoke_engine_parity.py \
            | tee "$RUNNER_TEMP/engine-parity-report.json"
          python -c 'import json,os; from pathlib import Path; payload=json.loads(Path(os.environ["RUNNER_TEMP"], "engine-parity-report.json").read_text()); assert payload["claim_scope"] == "fixture_canonical_semantics_only" and payload["case_count"] == 7'
          test "$(docker network inspect stonks-engine-parity-ci --format '{{.Internal}}')" = "true"

      - name: Preserve bounded parity provenance
        uses: actions/upload-artifact@v6
        with:
          name: engine-parity-${{ github.run_id }}
          path: ${{ runner.temp }}/engine-parity-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Stop parity sidecars
        if: always()
        run: |
          docker rm --force stonks-parity-nautilus-ci || true
          docker rm --force stonks-parity-lean-ci || true
          docker network rm stonks-engine-parity-ci || true

  rd-agent-sandbox:
    name: RD-Agent factor sandbox / ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      UV_FROZEN: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8
        with:
          version: "0.9.27"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Install exact independent environments
        run: |
          uv sync --frozen
          uv lock --check --project workers/quant_lab/rd_agent
          uv sync --frozen --project workers/quant_lab/rd_agent

      - name: Verify contracts, core boundary and one-shot worker
        shell: bash
        run: |
          uv run --project workers/quant_lab/rd_agent ruff check \
            workers/quant_lab/rd_agent \
            packages/contracts/src/stonks_contracts/candidate_scan.py \
            packages/contracts/src/stonks_contracts/rd_agent.py \
            src/stonks_agent/application/evaluation/rd_agent.py \
            scripts/smoke_rd_agent.py scripts/verify_rd_agent_sbom.py \
            tests/contracts/workers/test_rd_agent.py \
            tests/evaluation/test_rd_agent_candidate.py \
            tests/security/test_rd_agent_sandbox_boundary.py \
            tests/unit/test_verify_rd_agent_sbom.py
          MYPYPATH=".:src:packages/contracts/src" \
            uv run --project workers/quant_lab/rd_agent mypy --strict \
            workers/quant_lab/rd_agent/adapter.py \
            workers/quant_lab/rd_agent/candidate_runner.py \
            workers/quant_lab/rd_agent/cli.py \
            workers/quant_lab/rd_agent/runner.py
          MYPYPATH=".:src:packages/contracts/src" uv run mypy --strict \
            packages/contracts/src/stonks_contracts/candidate_scan.py \
            packages/contracts/src/stonks_contracts/rd_agent.py \
            src/stonks_agent/application/evaluation/rd_agent.py \
            scripts/smoke_rd_agent.py scripts/verify_rd_agent_sbom.py
          PYTHONPATH=".:src:packages/contracts/src" \
            uv run --project workers/quant_lab/rd_agent pytest \
            -c workers/quant_lab/rd_agent/pyproject.toml -q --no-cov \
            workers/quant_lab/rd_agent/tests \
            tests/contracts/workers/test_rd_agent.py
          PYTHONPATH=".:src:packages/contracts/src" uv run pytest -q --no-cov \
            tests/contracts/workers/test_rd_agent.py \
            tests/evaluation/test_rd_agent_candidate.py \
            tests/security/test_rd_agent_sandbox_boundary.py \
            tests/unit/test_verify_rd_agent_sbom.py

      - name: Audit exact frozen Python dependencies
        shell: bash
        run: |
          uv export --project workers/quant_lab/rd_agent --quiet --frozen \
            --no-dev --no-emit-project --no-emit-local \
            --format requirements.txt \
            --output-file "$RUNNER_TEMP/rd-agent-requirements.txt"
          uv run --project workers/quant_lab/rd_agent pip-audit --strict \
            --requirement "$RUNNER_TEMP/rd-agent-requirements.txt"

      - name: Build pinned minimal runtime image
        run: >-
          docker build -f workers/quant_lab/rd_agent/Dockerfile
          -t stonks-rd-agent-factor-sandbox:p5.8 .

      - name: Generate and verify SBOM and exact OpenVEX CVE gate
        shell: bash
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$RUNNER_TEMP:/out" \
            anchore/syft@sha256:86fde6445b483d902fe011dd9f68c4987dd94e07da1e9edc004e3c2422650de6 \
            docker:stonks-rd-agent-factor-sandbox:p5.8 \
            -o cyclonedx-json=/out/rd-agent-sbom.cdx.json
          uv run python scripts/verify_rd_agent_sbom.py \
            "$RUNNER_TEMP/rd-agent-sbom.cdx.json"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/workers/quant_lab/rd_agent:/config:ro" \
            anchore/grype@sha256:391bfda62888fb4e98ff5c4c81598f7431a3c1eac3f8519d69d1ff00df247c1d \
            -c /config/grype.yaml \
            docker:stonks-rd-agent-factor-sandbox:p5.8 \
            --vex /config/openvex.json --show-suppressed \
            --fail-on high --output table

      - name: Smoke two fresh hardened sandboxes and provenance
        shell: bash
        run: |
          runtime_hash="$(PYTHONPATH=.:src:packages/contracts/src \
            uv run --project workers/quant_lab/rd_agent python -c \
            'from pathlib import Path; from workers.quant_lab.rd_agent.adapter import compute_runtime_hash; print(compute_runtime_hash(Path("workers/quant_lab/rd_agent")))')"
          image_digest="$(docker image inspect \
            stonks-rd-agent-factor-sandbox:p5.8 --format '{{.Id}}')"
          STONKS_RD_RUNTIME_HASH="$runtime_hash" \
            STONKS_RD_IMAGE_DIGEST="$image_digest" \
            docker compose -f infra/compose.rd-agent.yaml config --quiet
          PYTHONPATH=".:src:packages/contracts/src" \
            uv run python scripts/smoke_rd_agent.py
          test "$(docker image inspect stonks-rd-agent-factor-sandbox:p5.8 \
            --format '{{.Config.User}}')" = "65532:65532"
          docker run --rm --entrypoint sha256sum \
            stonks-rd-agent-factor-sandbox:p5.8 \
            /usr/share/sources/rd-agent/rd-agent-4f9ecb00.tar.gz \
            | grep '^837010068449c5e874dee83f91240b281bed529acd214fdd1bdb6678f620caa4 '
          docker run --rm --entrypoint sha256sum \
            stonks-rd-agent-factor-sandbox:p5.8 \
            /usr/share/licenses/stonks-rd-agent-factor-sandbox/RD-AGENT-LICENSE \
            | grep '^c2cfccb812fe482101a8f04597dfc5a9991a6b2748266c47ac91b6a5aae15383 '
          docker run --rm --entrypoint sha256sum \
            stonks-rd-agent-factor-sandbox:p5.8 \
            /usr/share/licenses/stonks-rd-agent-factor-sandbox/LICENSE \
            | grep '^c71d239df91726fc519c6eb72d318ec65820627232b2f796219e87dcf35d0ab4 '

      - name: Preserve bounded SBOM provenance
        uses: actions/upload-artifact@v6
        with:
          name: rd-agent-sbom-${{ github.run_id }}
          path: ${{ runner.temp }}/rd-agent-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

  optional-integration-manifests:
    name: Default-off optional integration manifests / ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      UV_FROZEN: "1"
      STONKS_SERVICE_OIDC_ISSUER: https://identity.manifest.invalid
      STONKS_SERVICE_OIDC_CORE_SUBJECT: service:core-runner
      STONKS_SERVICE_OIDC_CORE_CLIENT_ID: stonks-core-runner
      STONKS_SERVICE_OIDC_JWKS_HOST_FILE: /tmp/manifest-service-jwks.json
      STONKS_KRONOS_SERVICE_OIDC_AUDIENCE: stonks-kronos-ingress
      STONKS_TRADINGAGENTS_SERVICE_OIDC_AUDIENCE: stonks-tradingagents-ingress
      STONKS_QUANT_LAB_SERVICE_OIDC_AUDIENCE: stonks-quant-lab-ingress
      STONKS_NAUTILUS_SERVICE_OIDC_AUDIENCE: stonks-nautilus-ingress
      STONKS_LEAN_SERVICE_OIDC_AUDIENCE: stonks-lean-ingress
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8
        with:
          version: "0.9.27"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Install frozen core verification environment
        run: uv sync --frozen

      - name: Verify typed catalog and deployment boundary
        run: |
          uv run ruff format --check \
            src/stonks_agent/config/features.py \
            tests/config/test_optional_features.py \
            tests/security/test_optional_integrations.py \
            tests/security/test_service_runtime_manifests.py
          uv run ruff check \
            src/stonks_agent/config/features.py \
            tests/config/test_optional_features.py \
            tests/security/test_optional_integrations.py \
            tests/security/test_service_runtime_manifests.py
          uv run mypy --strict src/stonks_agent/config/features.py
          uv run pytest -q --no-cov \
            tests/config/test_optional_features.py \
            tests/security/test_optional_integrations.py \
            tests/security/test_service_runtime_manifests.py

      - name: Render zero-default and every explicit profile
        shell: bash
        run: |
          docker compose -f infra/compose.optional.yaml config --quiet
          test -z "$(docker compose -f infra/compose.optional.yaml config --services)"
          mapfile -t profiles < <(
            docker compose -f infra/compose.optional.yaml config --profiles
          )
          test "${#profiles[@]}" -eq 10
          for profile in "${profiles[@]}"; do
            docker compose -f infra/compose.optional.yaml \
              --profile "$profile" config --quiet
          done
