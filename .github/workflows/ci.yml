name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
      UV_FROZEN: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8
        with:
          version: "0.9.27"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Install frozen environment
        run: uv sync --frozen

      - name: Run quality, security and governance gates
        run: uv run python scripts/verify.py

  postgres:
    name: PostgreSQL 17 integration / ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      UV_FROZEN: "1"
      STONKS_TEST_DATABASE_URL: postgresql+psycopg://postgres@127.0.0.1:5432/stonks_test
    services:
      postgres:
        image: postgres:17.10-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: stonks_test
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stonks_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8
        with:
          version: "0.9.27"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Install frozen environment
        run: uv sync --frozen

      - name: Run PostgreSQL integration and all core gates
        run: uv run python scripts/verify.py --with-postgres

  openbb-sidecar:
    name: Optional OpenBB sidecar / ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      UV_FROZEN: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8
        with:
          version: "0.9.27"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Install frozen core verification environment
        run: uv sync --frozen

      - name: Verify static policy, sidecar lock and Compose model
        run: |
          uv run python scripts/verify_openbb_sidecar.py
          uv lock --check --project sidecars/openbb
          docker compose -f infra/compose.openbb.yaml config --quiet

      - name: Audit exact frozen sidecar dependencies
        shell: bash
        run: |
          uv export --project sidecars/openbb --quiet --frozen --no-dev \
            --no-emit-project --format requirements.txt \
            --output-file "$RUNNER_TEMP/openbb-requirements.txt"
          uv run pip-audit --strict --requirement \
            "$RUNNER_TEMP/openbb-requirements.txt"

      - name: Build exact optional sidecar image
        run: docker compose -f infra/compose.openbb.yaml build --pull openbb

      - name: Start healthy optional sidecar
        run: >-
          docker compose -f infra/compose.openbb.yaml up --detach --wait
          --wait-timeout 240 openbb

      - name: Smoke exact adapter and corresponding source
        run: >-
          uv run python scripts/smoke_openbb.py
          --health-timeout 120 --request-timeout 60

      - name: Verify health and deployed corresponding source
        shell: bash
        run: |
          curl --fail --silent --show-error \
            --retry 10 --retry-delay 2 --retry-all-errors \
            http://127.0.0.1:6900/healthz \
            | python -c 'import json,sys; p=json.load(sys.stdin); assert p == {"status":"ok","provider":"yfinance","source":"/source"}'
          curl --fail --silent --show-error \
            --dump-header /tmp/openbb-source.headers \
            --output /tmp/stonks-openbb-sidecar-source.tar.gz \
            http://127.0.0.1:6900/source
          grep --fixed-strings --ignore-case \
            'Link: </source>; rel="source"' /tmp/openbb-source.headers
          tar -tzf /tmp/stonks-openbb-sidecar-source.tar.gz \
            > /tmp/openbb-source-members.txt
          for member in \
            Dockerfile NOTICE.md OPENBB_LICENSE.txt SOURCE_OFFER.md \
            license-policy.yaml \
            provider-manifest.yaml pyproject.toml sbom.cdx.json uv.lock \
            upstream/openbb_core-1.6.13.tar.gz \
            upstream/openbb_equity-1.6.2.tar.gz \
            upstream/openbb_platform_api-1.3.6.tar.gz \
            upstream/openbb_yfinance-1.6.3.tar.gz; do
            grep --fixed-strings --line-regexp "./${member}" \
              /tmp/openbb-source-members.txt
          done

      - name: Stop optional sidecar
        if: always()
        run: >-
          docker compose -f infra/compose.openbb.yaml down
          --volumes --remove-orphans

  nautilus-sidecar:
    name: Optional NautilusTrader sidecar / ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      UV_FROZEN: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8
        with:
          version: "0.9.27"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Install frozen core and sidecar environments
        run: |
          uv sync --frozen
          uv lock --check --project sidecars/nautilus
          uv sync --frozen --project sidecars/nautilus

      - name: Verify sidecar source and real engine replay
        shell: bash
        run: |
          uv run --project sidecars/nautilus ruff check sidecars/nautilus
          MYPYPATH=".:src:packages/contracts/src" \
            uv run --project sidecars/nautilus mypy --strict \
            sidecars/nautilus/adapter.py sidecars/nautilus/app.py \
            sidecars/nautilus/engine.py sidecars/nautilus/runtime_app.py
          PYTHONPATH=".:src:packages/contracts/src" \
            uv run --project sidecars/nautilus pytest -q --no-cov \
            sidecars/nautilus/tests

      - name: Audit exact frozen runtime dependencies
        shell: bash
        run: |
          uv export --project sidecars/nautilus --quiet --frozen --no-dev \
            --no-emit-project --no-emit-local --format requirements.txt \
            --output-file "$RUNNER_TEMP/nautilus-requirements.txt"
          uv run pip-audit --strict --requirement \
            "$RUNNER_TEMP/nautilus-requirements.txt"
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/nautilus-runtime" \
            uv sync --frozen --no-dev --project sidecars/nautilus
          uv run cyclonedx-py environment \
            "$RUNNER_TEMP/nautilus-runtime/bin/python" \
            --pyproject sidecars/nautilus/pyproject.toml \
            --output-reproducible --spec-version 1.6 --output-format JSON \
            --output-file "$RUNNER_TEMP/nautilus-sbom.cdx.json"
          uv run python scripts/verify_nautilus_sbom.py \
            "$RUNNER_TEMP/nautilus-sbom.cdx.json"

      - name: Build hardened sidecar image
        run: >-
          docker build -f sidecars/nautilus/Dockerfile
          -t stonks-nautilus-sidecar:p5.5 .

      - name: Start sidecar with exact runtime identity
        shell: bash
        run: |
          runtime_hash="$(uv run python -c "from pathlib import Path; from sidecars.nautilus.adapter import compute_runtime_hash; print(compute_runtime_hash(Path('sidecars/nautilus')))")"
          image_digest="$(docker image inspect stonks-nautilus-sidecar:p5.5 --format '{{.Id}}')"
          service_token="$(openssl rand -hex 32)"
          echo "NAUTILUS_RUNTIME_HASH=$runtime_hash" >> "$GITHUB_ENV"
          echo "NAUTILUS_IMAGE_DIGEST=$image_digest" >> "$GITHUB_ENV"
          echo "NAUTILUS_SERVICE_TOKEN=$service_token" >> "$GITHUB_ENV"
          docker network create --internal stonks-nautilus-ci
          docker run --detach --rm --name stonks-nautilus-ci \
            --network stonks-nautilus-ci \
            --read-only --tmpfs /tmp:size=64m,mode=1777 --cap-drop ALL \
            --security-opt no-new-privileges --memory 2g --memory-swap 2g \
            --cpus 2 --pids-limit 256 \
            --env STONKS_NAUTILUS_RUNTIME_HASH="$runtime_hash" \
            --env STONKS_NAUTILUS_IMAGE_DIGEST="$image_digest" \
            --env STONKS_NAUTILUS_SERVICE_TOKEN="$service_token" \
            "$image_digest"
          for attempt in {1..30}; do
            docker exec stonks-nautilus-ci python -c \
              "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:7400/healthz', timeout=1).status == 200" \
              && break
            if [ "$attempt" -eq 30 ]; then exit 1; fi
            sleep 1
          done

      - name: Smoke canonical HTTP replay and image policy
        shell: bash
        run: |
          docker exec stonks-nautilus-ci python /workspace/scripts/smoke_nautilus.py \
            --runtime-hash "$NAUTILUS_RUNTIME_HASH" \
            --image-digest "$NAUTILUS_IMAGE_DIGEST" \
            --service-token "$NAUTILUS_SERVICE_TOKEN"
          test "$(docker image inspect stonks-nautilus-sidecar:p5.5 --format '{{.Config.User}}')" = "65532:65532"
          test "$(docker network inspect stonks-nautilus-ci --format '{{.Internal}}')" = "true"
          docker exec stonks-nautilus-ci python -c \
            "import importlib.util; assert importlib.util.find_spec('stonks_agent') is None"
          ! docker exec stonks-nautilus-ci env \
            | grep --extended-regexp --ignore-case \
              'database_url|postgres|redis_url|broker_token'
          docker exec stonks-nautilus-ci test -s \
            /usr/share/licenses/stonks-nautilus-sidecar/NAUTILUS-LGPL-3.0
          docker exec stonks-nautilus-ci test -s \
            /usr/share/licenses/stonks-nautilus-sidecar/GNU-GPL-3.0
          docker exec stonks-nautilus-ci sha256sum \
            /usr/share/source/nautilus-trader/nautilus_trader-1.230.0.tar.gz \
            | grep '^cc7eaa247e640e46588094fcca44f34f4b6330eeec41e9247068f2500921757d '

      - name: Stop NautilusTrader sidecar
        if: always()
        run: |
          docker rm --force stonks-nautilus-ci || true
          docker network rm stonks-nautilus-ci || true
