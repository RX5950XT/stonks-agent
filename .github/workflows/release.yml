name: Keyless release

on:
  push:
    tags: ["v*.*.*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Protected exact tag gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.identity.outputs.version }}
      image: ${{ steps.identity.outputs.image }}
    steps:
      - name: Checkout exact tag without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Set up frozen uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.9.27"
          enable-cache: false

      - id: identity
        name: Reject fork mutable tag or non-main commit
        shell: bash
        env:
          IS_FORK: ${{ github.event.repository.fork }}
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          test "$IS_FORK" = "false"
          test "$GITHUB_REF_TYPE" = "tag"
          test "$REF_PROTECTED" = "true"
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          version="${GITHUB_REF_NAME#v}"
          project_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          test "$version" = "$project_version"
          repository="$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$repository" >> "$GITHUB_OUTPUT"

      - name: Re-run frozen source gates on tag commit
        run: |
          uv sync --frozen
          uv run python scripts/verify.py
          uv run python scripts/export_openapi.py
          git diff --exit-code -- schemas/openapi

  authorize:
    name: Human release authorization
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: release
    permissions: {}
    steps:
      - run: echo "protected release environment approved"

  build-scan:
    name: Clean tag build and scan
    needs: [gate, authorize]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - name: Checkout exact tag without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Set up frozen uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.9.27"
          enable-cache: false

      - name: Build clean core and OpenBB corresponding source
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          SOURCE_URL: https://github.com/${{ github.repository }}
        run: |
          uv sync --frozen
          docker build -f Dockerfile \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --build-arg SOURCE_URL="$SOURCE_URL" \
            --build-arg RELEASE_VERSION="$VERSION" \
            -t stonks-agent-core:release .
          docker build -f sidecars/openbb/Dockerfile \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --build-arg SOURCE_URL="$SOURCE_URL" \
            --build-arg RELEASE_VERSION="$VERSION" \
            -t stonks-openbb-sidecar:release .

      - name: Create frozen reports and scan exact local image
        shell: bash
        env:
          IMAGE: ${{ needs.gate.outputs.image }}
        run: |
          set -euo pipefail
          input="$RUNNER_TEMP/release-input"
          bundle="$input/bundle"
          mkdir -p "$input/scan"
          mkdir -p "$RUNNER_TEMP/grype-cache"
          docker save --output "$input/scan/core-image.tar" \
            stonks-agent-core:release
          uv run python scripts/verify_release.py stage --root . --bundle "$bundle"
          uv run python scripts/check_secrets.py > "$input/secrets.json"
          uv run python scripts/check_upstream_policy.py > "$input/upstream.json"
          uv run python scripts/verify_release.py audit-locks \
            --root . --report "$input/lock-report.json"
          uv export --quiet --frozen --no-dev --no-emit-project \
            --no-emit-local --format requirements.txt \
            --output-file "$input/core-requirements.txt"
          uv run pip-audit --strict --format json \
            --requirement "$input/core-requirements.txt" \
            --output "$input/dependency-audit.json"
          docker run --rm --network none \
            -e SYFT_CHECK_FOR_APP_UPDATE=false \
            -v "$input/scan:/out" \
            anchore/syft:v1.44.0@sha256:86fde6445b483d902fe011dd9f68c4987dd94e07da1e9edc004e3c2422650de6 \
            docker-archive:/out/core-image.tar \
            -o cyclonedx-json=/out/core.raw.cdx.json
          image_id="$(docker image inspect stonks-agent-core:release --format '{{.Id}}')"
          subject="${IMAGE}@${image_id}"
          sandbox_image="$(python -c 'import json; print(json.load(open("config/release/core-runtime-legal.json"))["alpine"]["corresponding_source"]["sandbox_image"])')"
          uv run python scripts/generate_alpine_source.py \
            --image "$image_id" \
            --legal config/release/core-runtime-legal.json \
            --sandbox-image "$sandbox_image" \
            --output "$input/scan/alpine-corresponding-source.tar.gz"
          uv run python scripts/generate_python_source.py \
            --policy config/release/python-source-policy.json \
            --uv-lock uv.lock \
            --output "$input/scan/python-corresponding-source.tar.gz"
          uv run python scripts/generate_sbom.py \
            --image "$subject" \
            --raw-sbom "$input/scan/core.raw.cdx.json" \
            --output "$input/scan/core.cdx.json" \
            --inventory "$input/scan/core.inventory.json"
          uv run python scripts/generate_image_report.py \
            --local-reference stonks-agent-core:release \
            --subject "$subject" --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" --version "${GITHUB_REF_NAME#v}" \
            --allow-local-candidate \
            --output "$input/scan/core-image.json"
          docker run --rm \
            -e GRYPE_DB_CACHE_DIR=/grype-db \
            -e GRYPE_CHECK_FOR_APP_UPDATE=false \
            --mount \
              "type=bind,source=$RUNNER_TEMP/grype-cache,target=/grype-db" \
            anchore/grype:v0.112.0@sha256:391bfda62888fb4e98ff5c4c81598f7431a3c1eac3f8519d69d1ff00df247c1d \
            db update
          docker run --rm --network none \
            -e GRYPE_DB_CACHE_DIR=/grype-db \
            -e GRYPE_DB_AUTO_UPDATE=false \
            -e GRYPE_CHECK_FOR_APP_UPDATE=false \
            --mount \
              "type=bind,source=$RUNNER_TEMP/grype-cache,target=/grype-db,readonly" \
            -v "$input/scan:/out" \
            -v "$PWD/config/release:/config:ro" \
            anchore/grype:v0.112.0@sha256:391bfda62888fb4e98ff5c4c81598f7431a3c1eac3f8519d69d1ff00df247c1d \
            sbom:/out/core.raw.cdx.json --vex /config/core.openvex.json \
            --show-suppressed --fail-on high \
            --output json --file /out/core.grype.json
          docker run --rm --network none \
            -e GRYPE_DB_CACHE_DIR=/grype-db \
            -e GRYPE_DB_AUTO_UPDATE=false \
            -e GRYPE_CHECK_FOR_APP_UPDATE=false \
            --mount \
              "type=bind,source=$RUNNER_TEMP/grype-cache,target=/grype-db,readonly" \
            anchore/grype:v0.112.0@sha256:391bfda62888fb4e98ff5c4c81598f7431a3c1eac3f8519d69d1ff00df247c1d \
            db status --output json > "$input/scan/grype-db.json"
          mkdir -p "$bundle/payload/release"
          cp "$input/scan/core.cdx.json" "$bundle/payload/release/core.cdx.json"
          cp "$input/scan/core.inventory.json" \
            "$bundle/payload/release/core.inventory.json"
          cp "$input/scan/core-image.json" \
            "$bundle/payload/release/core-image.json"
          cp "$input/scan/alpine-corresponding-source.tar.gz" \
            "$bundle/payload/release/alpine-corresponding-source.tar.gz"
          cp "$input/scan/python-corresponding-source.tar.gz" \
            "$bundle/payload/release/python-corresponding-source.tar.gz"
          cp "$input/scan/core.grype.json" "$bundle/payload/release/core.grype.json"
          cp "$input/scan/grype-db.json" "$bundle/payload/release/grype-db.json"
          cp "$input/secrets.json" "$bundle/payload/release/secrets.json"
          cp "$input/upstream.json" "$bundle/payload/release/upstream.json"
          cp "$input/lock-report.json" "$bundle/payload/release/lock-report.json"
          cp "$input/dependency-audit.json" \
            "$bundle/payload/release/dependency-audit.json"
          container="$(docker create stonks-openbb-sidecar:release)"
          docker cp "$container:/srv/stonks-openbb-sidecar-source.tar.gz" \
            "$bundle/payload/release/openbb-corresponding-source.tar.gz"
          docker rm "$container"
          uv run python scripts/verify_release.py create \
            --bundle "$bundle" --version "${GITHUB_REF_NAME#v}" \
            --tag "$GITHUB_REF_NAME" --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" --image "$subject" \
            --signing-mode unsigned-candidate
          uv run python scripts/verify_release.py verify \
            --bundle "$bundle" --expected-repository "$GITHUB_REPOSITORY" \
            --expected-tag "$GITHUB_REF_NAME" --expected-commit "$GITHUB_SHA" \
            --report "$bundle/verification-report.json"
          mv "$input/scan/core-image.tar" "$input/core-image.tar"
          sha256sum "$input/core-image.tar" > "$input/SHA256SUMS"

      - name: Transfer only this workflow's checksummed build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-input
          path: ${{ runner.temp }}/release-input
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  publish-image:
    name: Publish exact image
    needs: [gate, authorize, build-scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Download same-workflow build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-input
          path: ${{ runner.temp }}/release-input

      - name: Verify and load exact archive
        run: |
          cd "$RUNNER_TEMP/release-input"
          sha256sum --check SHA256SUMS
          docker load --input core-image.tar

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: push
        name: Push and resolve registry-returned digest
        shell: bash
        env:
          IMAGE: ${{ needs.gate.outputs.image }}
        run: |
          docker tag stonks-agent-core:release "$IMAGE:$GITHUB_REF_NAME"
          output="$RUNNER_TEMP/docker-push.out"
          docker push "$IMAGE:$GITHUB_REF_NAME" | tee "$output"
          mapfile -t digests < <(
            sed -n 's/^.*digest: \(sha256:[0-9a-f]\{64\}\).*$/\1/p' "$output"
          )
          test "${#digests[@]}" -eq 1
          digest="${digests[0]}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  attest-sign:
    name: Keyless signature and attestations
    needs: [gate, authorize, build-scan, publish-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout exact verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Set up frozen uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.9.27"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Download same-workflow release input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-input
          path: ${{ runner.temp }}/release-input

      - name: Login to GHCR for signing and registry attestations
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Bind final registry digest and create signed manifest
        shell: bash
        env:
          IMAGE: ${{ needs.gate.outputs.image }}
          IMAGE_DIGEST: ${{ needs.publish-image.outputs.digest }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          uv sync --frozen
          input="$RUNNER_TEMP/release-input"
          bundle="$input/bundle"
          subject="${IMAGE}@${IMAGE_DIGEST}"
          expected_config_digest="$(
            python -c 'import json,sys; print(json.load(open(sys.argv[1]))["config_digest"])' \
              "$bundle/payload/release/core-image.json"
          )"
          docker pull "$subject"
          uv run python scripts/generate_image_report.py \
            --local-reference "$subject" --subject "$subject" \
            --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" \
            --version "$VERSION" \
            --output "$bundle/payload/release/core-image.final.json"
          observed_config_digest="$(
            python -c 'import json,sys; print(json.load(open(sys.argv[1]))["config_digest"])' \
              "$bundle/payload/release/core-image.final.json"
          )"
          test "$observed_config_digest" = "$expected_config_digest"
          mv "$bundle/payload/release/core-image.final.json" \
            "$bundle/payload/release/core-image.json"
          uv run python scripts/generate_sbom.py \
            --image "$subject" \
            --raw-sbom "$input/scan/core.raw.cdx.json" \
            --output "$bundle/payload/release/core.cdx.json" \
            --inventory "$bundle/payload/release/core.inventory.json"
          mkdir -p "$bundle/signatures"
          cosign sign --yes \
            --bundle "$bundle/signatures/core-image.sigstore.json" \
            "$subject"
          identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF"
          cosign verify-blob-attestation \
            --bundle "$bundle/signatures/core-image.sigstore.json" \
            --digest "${IMAGE_DIGEST#sha256:}" --digestAlg sha256 \
            --type https://sigstore.dev/cosign/sign/v1 \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer \
              https://token.actions.githubusercontent.com \
            --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
            --certificate-github-workflow-ref "$GITHUB_REF" \
            --certificate-github-workflow-sha "$GITHUB_SHA" \
            --certificate-github-workflow-trigger push
          cosign attach attestation \
            --attestation "$bundle/signatures/core-image.sigstore.json" \
            "$subject"
          registry_verified=false
          for attempt in $(seq 1 6); do
            if cosign verify-attestation \
              --type https://sigstore.dev/cosign/sign/v1 \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer \
                https://token.actions.githubusercontent.com \
              --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
              --certificate-github-workflow-ref "$GITHUB_REF" \
              --certificate-github-workflow-sha "$GITHUB_SHA" \
              --certificate-github-workflow-trigger push \
              "$subject"; then
              registry_verified=true
              break
            fi
            test "$attempt" -lt 6
            sleep "$((attempt * 5))"
          done
          test "$registry_verified" = "true"
          uv run python scripts/verify_release.py create \
            --bundle "$bundle" --version "$VERSION" \
            --tag "$GITHUB_REF_NAME" --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" --image "$subject" \
            --signing-mode keyless-release
          cosign sign-blob --yes \
            --bundle "$bundle/signatures/release-manifest.sigstore.json" \
            "$bundle/release-manifest.json"
          uv run python scripts/verify_release.py verify \
            --bundle "$bundle" --expected-repository "$GITHUB_REPOSITORY" \
            --expected-tag "$GITHUB_REF_NAME" --expected-commit "$GITHUB_SHA" \
            --require-signatures \
            --report "$bundle/verification-report.json"
          cosign sign-blob --yes \
            --bundle "$bundle/signatures/verification-report.sigstore.json" \
            "$bundle/verification-report.json"
          cosign verify-blob \
            --bundle "$bundle/signatures/verification-report.sigstore.json" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer \
              https://token.actions.githubusercontent.com \
            "$bundle/verification-report.json"

      - id: provenance
        name: Publish build provenance attestation
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ needs.gate.outputs.image }}
          subject-digest: ${{ needs.publish-image.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - id: sbom_attestation
        name: Publish CycloneDX attestation
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ needs.gate.outputs.image }}
          subject-digest: ${{ needs.publish-image.outputs.digest }}
          sbom-path: ${{ runner.temp }}/release-input/bundle/payload/release/core.cdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Close and verify all five formal Sigstore evidence files
        env:
          GH_TOKEN: ${{ github.token }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom_attestation.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -n "$PROVENANCE_BUNDLE"
          test -n "$SBOM_BUNDLE"
          cp "$PROVENANCE_BUNDLE" \
            "$RUNNER_TEMP/release-input/bundle/signatures/github-provenance.sigstore.json"
          cp "$SBOM_BUNDLE" \
            "$RUNNER_TEMP/release-input/bundle/signatures/github-sbom.sigstore.json"
          uv run python scripts/verify_release.py verify-final \
            --bundle "$RUNNER_TEMP/release-input/bundle" \
            --expected-repository "$GITHUB_REPOSITORY" \
            --expected-tag "$GITHUB_REF_NAME" \
            --expected-commit "$GITHUB_SHA"

      - name: Transfer signed verified release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-release
          path: ${{ runner.temp }}/release-input/bundle
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  github-release:
    name: Publish immutable GitHub release
    needs: [gate, attest-sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download signed verified release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-release
          path: ${{ runner.temp }}/signed-release

      - name: Resume or publish and verify immutable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          archive="stonks-agent-${GITHUB_REF_NAME}.tar.gz"
          checksum="${archive}.sha256"
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            -czf "$archive" signed-release
          sha256sum "$archive" > "$checksum"
          if is_draft="$(
            gh release view "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft \
              2>/dev/null
          )"; then
            if [ "$is_draft" = "true" ]; then
              gh release upload "$GITHUB_REF_NAME" "$archive" "$checksum" \
                --repo "$GITHUB_REPOSITORY" --clobber
              gh release edit "$GITHUB_REF_NAME" \
                --repo "$GITHUB_REPOSITORY" --draft=false
            else
              test "$is_draft" = "false"
            fi
          else
            gh release create "$GITHUB_REF_NAME" "$archive" "$checksum" \
              --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
              --title "Stonks Agent ${GITHUB_REF_NAME}" \
              --notes "Paper-only verified release."
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" --draft=false
          fi
          # Retry only immutable-release observation; publication is never repeated.
          verified=false
          for attempt in $(seq 1 6); do
            if gh release verify "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY"; then
              verified=true
              break
            fi
            test "$attempt" -lt 6
            sleep "$((attempt * 5))"
          done
          test "$verified" = "true"
          gh release verify-asset "$GITHUB_REF_NAME" "$archive" \
            --repo "$GITHUB_REPOSITORY"
          gh release verify-asset "$GITHUB_REF_NAME" "$checksum" \
            --repo "$GITHUB_REPOSITORY"
