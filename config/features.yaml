    required_environment: []
    network_policy: provider_egress
    output_scope: canonical_observation
    affects_core_readiness: false
    execution_authority: false
    supply_chain:
      images: [stonks-openbb-sidecar:local]
      lock_paths: [sidecars/openbb/uv.lock]
      notice_paths: [sidecars/openbb/NOTICE.md, sidecars/openbb/SOURCE_OFFER.md]
      upstream_project: OpenBB
      source_identity: 1c74893140292944e71ff5cdd9536edf12f05483
      license_expression: AGPL-3.0-only
      sbom_mode: committed
      sbom_ref: sidecars/openbb/sbom.cdx.json
      cve_policy: fail_on_high
      core_dependency_allowed: false

