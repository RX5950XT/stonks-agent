schema_version: 1
execution_mode: paper
integrations:
  - name: ai_trader
    enabled: false
    kind: external_http
    compose_profiles: []
    config_paths: [config/platforms/ai_trader.yaml]
    required_environment: [AI_TRADER_ACCESS_TOKEN]
    network_policy: external_https
    output_scope: untrusted_evidence
    affects_core_readiness: false
    execution_authority: false
    supply_chain: null

  - name: openbb
    enabled: false
