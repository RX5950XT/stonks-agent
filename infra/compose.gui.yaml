name: stonks-gui-postgres

# Persistent local PostgreSQL for the Stonks Terminal paper panels only.
# It is not the deployment stack in compose.yaml: no core service, no worker,
# no published address beyond loopback, and the password is generated by the
# launcher into .data/gui/ rather than committed anywhere.

services:
  postgres:
    image: postgres:17.10-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    init: true
    pids_limit: 128
    mem_limit: 512m
    stop_grace_period: 15s
    restart: "no"
    environment:
      POSTGRES_DB: stonks
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/gui_postgres_password
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      PGDATA: /var/lib/postgresql/data/pgdata
    secrets: [gui_postgres_password]
    volumes: [gui_postgres_data:/var/lib/postgresql/data]
    tmpfs: [/var/run/postgresql, /tmp]
    ports: ["127.0.0.1:${STONKS_GUI_DB_PORT:-55433}:5432"]
    healthcheck:
      test: [CMD, pg_isready, -U, postgres, -d, stonks]
      interval: 2s
      timeout: 3s
      retries: 45
      start_period: 5s

secrets:
  gui_postgres_password:
    file: ${STONKS_GUI_DB_PASSWORD_FILE:?required}

volumes:
  gui_postgres_data:
