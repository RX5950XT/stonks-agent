services:
  kronos-cpu:
    build:
      context: ..
      dockerfile: workers/kronos/Dockerfile
      target: runtime-cpu
    environment:
      STONKS_KRONOS_MODEL_ROOT: /models
      STONKS_KRONOS_PROFILE: cpu
      STONKS_KRONOS_MAX_CONCURRENCY: "1"
      STONKS_SERVICE_OIDC_ISSUER: ${STONKS_SERVICE_OIDC_ISSUER:?required}
      STONKS_SERVICE_OIDC_AUDIENCE: ${STONKS_KRONOS_SERVICE_OIDC_AUDIENCE:?required}
      STONKS_SERVICE_OIDC_CORE_SUBJECT: ${STONKS_SERVICE_OIDC_CORE_SUBJECT:?required}
      STONKS_SERVICE_OIDC_CORE_CLIENT_ID: ${STONKS_SERVICE_OIDC_CORE_CLIENT_ID:?required}
      STONKS_SERVICE_OIDC_ALGORITHMS: RS256
      STONKS_SERVICE_OIDC_RECEIVER: kronos
      STONKS_SERVICE_OIDC_JWKS_FILE: /run/secrets/stonks-service-jwks.json
    volumes:
      - "${STONKS_KRONOS_MODEL_ROOT:-../.data/models/kronos}:/models:ro"
      - "${STONKS_SERVICE_OIDC_JWKS_HOST_FILE:?required}:/run/secrets/stonks-service-jwks.json:ro"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [kronos-internal]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    pids_limit: 256
    mem_limit: 8g
    cpus: 4.0

  kronos-cuda:
    build:
      context: ..
      dockerfile: workers/kronos/Dockerfile
      target: runtime-cuda
    environment:
      STONKS_KRONOS_MODEL_ROOT: /models
      STONKS_KRONOS_PROFILE: cuda
      STONKS_KRONOS_MAX_CONCURRENCY: "1"
      STONKS_SERVICE_OIDC_ISSUER: ${STONKS_SERVICE_OIDC_ISSUER:?required}
      STONKS_SERVICE_OIDC_AUDIENCE: ${STONKS_KRONOS_SERVICE_OIDC_AUDIENCE:?required}
      STONKS_SERVICE_OIDC_CORE_SUBJECT: ${STONKS_SERVICE_OIDC_CORE_SUBJECT:?required}
      STONKS_SERVICE_OIDC_CORE_CLIENT_ID: ${STONKS_SERVICE_OIDC_CORE_CLIENT_ID:?required}
      STONKS_SERVICE_OIDC_ALGORITHMS: RS256
      STONKS_SERVICE_OIDC_RECEIVER: kronos
      STONKS_SERVICE_OIDC_JWKS_FILE: /run/secrets/stonks-service-jwks.json
    volumes:
      - "${STONKS_KRONOS_MODEL_ROOT:-../.data/models/kronos}:/models:ro"
      - "${STONKS_SERVICE_OIDC_JWKS_HOST_FILE:?required}:/run/secrets/stonks-service-jwks.json:ro"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [kronos-internal]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    pids_limit: 256
    mem_limit: 12g
    cpus: 4.0
    gpus: all

networks:
  kronos-internal:
    internal: true
