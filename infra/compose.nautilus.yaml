services:
  nautilus:
    image: stonks-nautilus-sidecar:p5.5
    build:
      context: ..
      dockerfile: sidecars/nautilus/Dockerfile
      target: runtime
    environment:
      STONKS_NAUTILUS_RUNTIME_HASH: ${STONKS_NAUTILUS_RUNTIME_HASH:-disabled}
      STONKS_NAUTILUS_IMAGE_DIGEST: ${STONKS_NAUTILUS_IMAGE_DIGEST:-disabled}
      STONKS_NAUTILUS_SERVICE_TOKEN: ${STONKS_NAUTILUS_SERVICE_TOKEN:-disabled}
      STONKS_NAUTILUS_MAX_CONCURRENCY: "1"
      STONKS_NAUTILUS_MAX_REQUEST_BYTES: "16777216"
      STONKS_NAUTILUS_MAX_ORDERS: "10000"
      STONKS_NAUTILUS_MAX_BARS: "1000000"
      STONKS_NAUTILUS_MAX_ORDER_BAR_EVALUATIONS: "5000000"
      STONKS_NAUTILUS_MAX_SCHEDULE_CHILDREN: "100000"
    ports:
      - "127.0.0.1:7400:7400"
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [nautilus-internal]
    tmpfs:
      - "/tmp:rw,noexec,nosuid,nodev,size=512m,uid=65532,gid=65532,mode=0700"
    pids_limit: 256
    mem_limit: 3g
    cpus: 2.0
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          from urllib.request import urlopen;
          raise SystemExit(0 if urlopen('http://127.0.0.1:7400/healthz', timeout=2).status == 200 else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  nautilus-internal:
    internal: true
