services:
  quant-lab:
    build:
      context: ..
      dockerfile: workers/quant_lab/Dockerfile
      target: runtime
    environment:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
      STONKS_QUANT_LAB_MAX_CONCURRENCY: "1"
      STONKS_SERVICE_OIDC_ISSUER: ${STONKS_SERVICE_OIDC_ISSUER:?required}
      STONKS_SERVICE_OIDC_AUDIENCE: ${STONKS_QUANT_LAB_SERVICE_OIDC_AUDIENCE:?required}
      STONKS_SERVICE_OIDC_CORE_SUBJECT: ${STONKS_SERVICE_OIDC_CORE_SUBJECT:?required}
      STONKS_SERVICE_OIDC_CORE_CLIENT_ID: ${STONKS_SERVICE_OIDC_CORE_CLIENT_ID:?required}
      STONKS_SERVICE_OIDC_ALGORITHMS: RS256
      STONKS_SERVICE_OIDC_RECEIVER: quant_lab
      STONKS_SERVICE_OIDC_JWKS_FILE: /run/secrets/stonks-service-jwks.json
    volumes:
      - "${STONKS_SERVICE_OIDC_JWKS_HOST_FILE:?required}:/run/secrets/stonks-service-jwks.json:ro"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [quant-lab-internal]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    pids_limit: 128
    mem_limit: 2g
    cpus: 2.0

networks:
  quant-lab-internal:
    internal: true
