[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "stonks-contracts"
version = "0.1.0"
description = "Versioned wire contracts for Stonks Agent"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["pydantic==2.12.5"]

[project.optional-dependencies]
dev = [
  "mypy==1.19.1",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.14.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/stonks_contracts"]

[tool.pytest.ini_options]
testpaths = ["tests", "../../tests/contracts"]
addopts = ["--strict-config", "--strict-markers"]

[tool.coverage.run]
branch = true
source = ["stonks_contracts"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
