[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "stonks-service-auth"
version = "0.1.0"
description = "Minimal target-scoped OIDC service authentication for isolated runtimes"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "pydantic==2.12.5",
  "pyjwt[crypto]>=2.13,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/stonks_service_auth"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
