schema_version: 1
reviewed_at: "2026-07-11"
service:
  name: stonks-openbb-sidecar
  license: AGPL-3.0-only
  source_offer_path: /source
  health_path: /healthz
  runtime_auto_build: false
  upstream_repository: https://github.com/OpenBB-finance/OpenBB
  upstream_commit: 1c74893140292944e71ff5cdd9536edf12f05483
  upstream_commit_role: license-and-research-review
  upstream_raw_license_sha256: 442baa7865ddf53ba04808a29e4810ac1fd9c83383d4ac76297cec4569e19222
transport:
  canonical_origin: http://127.0.0.1:6900
  sidecar_listen_origin: http://openbb:6900
  tls_termination: none
  plaintext_scope: loopback-only
rest_policy:
  origin: http://127.0.0.1:6900
  endpoint: /api/v1/equity/price/historical
  provider: yfinance
  verified_markets:
    reviewed_at: "2026-08-30"
    method: >-
      Each market was queried through the running sidecar with the governed
      adapter before being listed. Symbol suffix is the only discriminator:
      .TW/.TWO resolve to TW, .HK to HK, everything else to US.
    markets:
      - market: US
        symbol_suffix: none
        verified_symbols: [AAPL]
        verified_intervals: ["1d", "1m", "2m", "5m", "15m", "30m", "90m", "1h", "1W", "1M"]
      - market: TW
        symbol_suffix: .TW
        verified_symbols: ["2330.TW", "0050.TW", "2412.TW"]
        verified_intervals: ["1d", "1m", "15m"]
        note: >-
          Intraday required the Asia/Taipei exchange zone. Before that fix a
          13:30 Taipei bar was read as America/New_York and rejected as
          openbb_future_data. After it, 2330.TW 1m returned 1326 bars whose
          last event time was 05:25Z, i.e. 13:25 Taipei inside the session.
    unverified_markets:
      - market: HK
        reason: >-
          No route was exercised, so .HK symbols resolve to a market that is not
          in the adapter capability set and fail closed.
  methods: [GET]
  redirect_policy: deny
  arbitrary_url_policy: deny
  query_fields: [symbol, start_date, end_date, interval, provider]
  intervals: ["1m", "2m", "5m", "15m", "30m", "90m", "1h", "1d", "1W", "1M"]
  intraday_timestamp_semantics: naive-exchange-local
unsupported_capabilities:
  reviewed_at: "2026-07-27"
  reason: >-
    Yahoo quoteSummary/screener endpoints require a crumb whose cookie seed host
    fc.yahoo.com no longer resolves; yfinance 1.5.1 and 1.5.2 both fail closed
    with HTTP 401. These routes stay off the allowlist instead of being faked.
  routes:
    - /api/v1/equity/price/quote
    - /api/v1/equity/profile
    - /api/v1/equity/fundamental/metrics
    - /api/v1/equity/discovery/gainers
service_identity_policy:
  verifier: stonks-service-auth==0.1.0
  protected_routes: [/api/v1/equity/price/historical]
  anonymous_routes: [/healthz, /source]
  permission: dispatch_assigned_market_data
  exact_target: MARKET:{market}/{symbol}
  receiver: openbb
  attempt_generation: 0
  request_binding: canonical-method-path-query-sha256
  attempt_nonce_hash_binding: request-hash
  query_authentication_order: authenticate-before-parse
