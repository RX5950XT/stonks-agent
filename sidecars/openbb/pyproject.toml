[project]
name = "stonks-openbb-sidecar"
version = "0.1.0"
description = "AGPL-3.0-only OpenBB REST sidecar for Stonks Agent"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-only"
dependencies = [
    "openbb-core==1.6.13",
    "openbb-equity==1.6.2",
    "openbb-platform-api==1.3.6",
    "openbb-yfinance==1.6.3",
    "stonks-service-auth",
]

[tool.uv]
package = false

[tool.uv.sources]
stonks-service-auth = { path = "../../packages/service-auth" }
