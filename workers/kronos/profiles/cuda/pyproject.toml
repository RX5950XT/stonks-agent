[project]
name = "stonks-kronos-worker-cuda"
version = "0.1.0"
description = "Isolated CUDA-only Kronos forecast worker"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "einops==0.8.1",
    "fastapi>=0.128,<1",
    "huggingface-hub==0.33.1",
    "numpy>=2.0,<3",
    "pandas==2.2.2",
    "pydantic>=2.12.5,<3",
    "safetensors==0.6.2",
    "stonks-contracts",
    "stonks-service-auth",
    "torch==2.12.1",
    "tqdm==4.67.1",
    "uvicorn>=0.40,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2,<3",
    "pip-audit>=2.9,<3",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.14,<1",
]

[tool.uv]
package = false

[tool.uv.sources]
stonks-contracts = { path = "../../../../packages/contracts" }
stonks-service-auth = { path = "../../../../packages/service-auth" }
torch = { index = "pytorch-cuda" }

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu129"
explicit = true
