[project]
name = "stonks-quant-lab-worker"
version = "0.1.0"
description = "Isolated deterministic Qlib research worker"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "cython==3.1.2",
    "dill==0.3.9",
    "fastapi>=0.128,<1",
    "filelock==3.20.3",
    "joblib==1.5.1",
    "loguru==0.7.3",
    "numpy==2.2.6",
    "packaging==25.0",
    "pandas==2.2.3",
    "pydantic-settings==2.10.1",
    "python-redis-lock==4.0.0",
    "pyyaml==6.0.2",
    "redis==6.2.0",
    "requests==2.33.0",
    "ruamel-yaml==0.18.10",
    "scikit-learn==1.7.2",
    "scipy==1.15.3",
    "setuptools==80.9.0",
    "setuptools-scm==8.3.1",
    "stonks-contracts",
    "stonks-service-auth",
    "uvicorn>=0.40,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2,<3",
    "mypy>=1.19,<2",
    "pip-audit>=2.9,<3",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.14,<1",
]

[tool.uv]
package = false

[tool.uv.sources]
stonks-contracts = { path = "../../packages/contracts" }
stonks-service-auth = { path = "../../packages/service-auth" }
