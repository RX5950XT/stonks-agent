[project]
name = "stonks-rd-agent-factor-sandbox"
version = "0.1.0"
description = "One-shot isolated evaluator for archived RD-Agent factor proposals"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.12.5,<3",
    "pyyaml>=6.0.3,<7",
    "stonks-contracts",
]

[dependency-groups]
dev = [
    "mypy>=1.19,<2",
    "pip-audit>=2.9,<3",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.14,<1",
    "types-pyyaml>=6.0.12.20260518,<7",
]

[tool.uv]
package = false

[tool.uv.sources]
stonks-contracts = { path = "../../../packages/contracts" }
