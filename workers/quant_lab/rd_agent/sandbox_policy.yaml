max_request_bytes: 16777216
runtime:
  worker_version: rd-agent-factor-sandbox/0.1.0
  adapter_version: factor-expression-v1
  rd_agent_commit: 4f9ecb005881cddc08df0124a2e894c018007679
  rd_agent_source_hash: 837010068449c5e874dee83f91240b281bed529acd214fdd1bdb6678f620caa4
  python_version: 3.12.13
sandbox:
  policy_id: rd-agent-sandbox/1
  platform: linux
  network_mode: none
  root_filesystem: read_only
  dataset_mount: read_only
  entrypoint: compute
  repetitions: 2
  max_source_bytes: 65536
  max_ast_nodes: 4096
  max_rows: 10000
  max_output_bytes: 2000000
  timeout_seconds: 5
  memory_megabytes: 256
  cpu_cores: "1"
  max_processes: 1
  max_open_files: 16
  max_log_bytes: 65536
  writable_tmpfs_megabytes: 32
  run_as_uid: 65532
  run_as_gid: 65532
  privileged: false
  capability_mode: drop_all
  no_new_privileges: true
  seccomp_profile: runtime/default
  apparmor_profile: docker-default
  device_access: none
  host_namespace_mode: private
  unix_socket_access: none
  environment_mode: allowlist
  source_mount: read_only
  output_tmpfs_options: rw,noexec,nosuid,nodev
  fixed_argv: true
  shell_allowed: false
  isolation_scope: fresh_container_per_repetition
  python_hash_seed: 0
  allowed_calls:
    - abs
    - all
    - any
    - bool
    - dict
    - enumerate
    - float
    - int
    - len
    - list
    - max
    - min
    - range
    - round
    - sorted
    - str
    - sum
    - tuple
    - zip
  forbidden_names:
    - __import__
    - breakpoint
    - compile
    - eval
    - exec
    - getattr
    - globals
    - input
    - locals
    - open
    - setattr
    - vars
  core_static_rescan_required: true
  core_full_evaluation_required: true
  promotion_allowed: false
