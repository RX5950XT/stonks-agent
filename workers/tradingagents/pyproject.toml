[project]
name = "stonks-tradingagents-worker"
version = "0.1.0"
description = "Isolated, evidence-scoped TradingAgents research worker"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.128,<1",
    "pydantic>=2.12.5,<3",
    "stonks-contracts",
    "tradingagents @ https://github.com/TauricResearch/TradingAgents/archive/01477f9afb7a47b849ed4c9259d3a9a4738d9fda.tar.gz",
    "uvicorn>=0.40,<1",
]

[dependency-groups]
dev = [
    "pip-audit>=2.9,<3",
    "pytest>=9,<10",
    "pytest-asyncio>=1.3,<2",
    "pytest-cov>=7,<8",
    "ruff>=0.14,<1",
]

[tool.uv]
package = false

[tool.uv.sources]
stonks-contracts = { path = "../../packages/contracts" }
